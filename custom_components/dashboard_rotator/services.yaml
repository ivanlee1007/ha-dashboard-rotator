pause:
  name: Pause rotation
  description: Pause dashboard view rotation on connected clients.
  fields:
    target_client_id:
      required: false
      example: dr-abc12345
      selector:
        text:
resume:
  name: Resume rotation
  description: Resume dashboard view rotation on connected clients.
  fields:
    target_client_id:
      required: false
      example: dr-abc12345
      selector:
        text:
next_view:
  name: Next view
  description: Jump to the next configured dashboard view.
  fields:
    target_client_id:
      required: false
      example: dr-abc12345
      selector:
        text:
previous_view:
  name: Previous view
  description: Jump to the previous configured dashboard view.
  fields:
    target_client_id:
      required: false
      example: dr-abc12345
      selector:
        text:
jump_to_view:
  name: Jump to view
  description: Jump to a specific dashboard view path.
  fields:
    path:
      required: true
      example: /lovelace-uninus/weather
      selector:
        text:
    target_client_id:
      required: false
      example: dr-abc12345
      selector:
        text:
client_state:
  name: Client state heartbeat
  description: Internal service used by the frontend controller to report current state.
set_client_alias:
  name: Set client alias
  description: Assign or clear a friendly alias for a browser client.
  fields:
    client_id:
      required: true
      example: dr-abc12345
      selector:
        text:
    alias:
      required: false
      example: lobby-tablet
      selector:
        text:
set_target_client:
  name: Set target client
  description: Set or clear the profile target client.
  fields:
    target_client_id:
      required: false
      example: dr-abc12345
      selector:
        text:
